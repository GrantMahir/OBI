
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oldenburg Burnout Inventory</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Oldenburg Burnout Inventory</h1>

    <form id="burnout-form">
      <fieldset>
        <legend>Client Information</legend>
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="profession" placeholder="Profession" required>
        <input type="number" name="age" placeholder="Age" required>
        <input type="text" name="gender" placeholder="Gender" required>
        <input type="date" name="submitted" required>
      </fieldset>

      <fieldset>
        <legend>Survey</legend>
        <div id="questions"></div>
      </fieldset>

      <button type="submit">Submit</button>
    </form>

    <div id="results" class="hidden">
      <h2>Results</h2>
      <p><strong>Disengagement Score:</strong> <span id="disengagement-score"></span></p>
      <p><strong>Exhaustion Score:</strong> <span id="exhaustion-score"></span></p>
      <p><strong>Total Score:</strong> <span id="total-score"></span></p>
      <p id="interpretation"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
